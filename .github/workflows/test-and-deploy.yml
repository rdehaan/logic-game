# Runs the tests on every push and pull request. On a push to main, the site
# is published to GitHub Pages afterwards, but only if the tests pass.
#
# For this, GitHub Pages must be set to deploy from GitHub Actions:
# repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

# The actions are pinned to a commit (the version in the comment), so that a
# changed tag cannot change what runs here; Dependabot (.github/dependabot.yml)
# proposes updates.

# Only read access by default; the deploy job asks for what it needs
permissions:
  contents: read

jobs:
  # All tests, also those in the browser (Chromium), on Linux
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # The tests without a browser (the engine, grading, and the command line,
  # which teachers run on their own computers) on Windows, macOS and Linux, with
  # every version of Node that package.json allows and that is supported
  # (the long-term support versions)
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      # (on Windows, git would otherwise turn the line endings of the files into CRLF)
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # The site is put together in a job of its own. The deploy job comes after
  # it, and by then the uploaded artifact is always in the list that
  # deploy-pages asks for. (Uploading and deploying in the same job sometimes
  # failed with "Found 0 artifact(s)", because right after the upload the
  # artifact is not always in that list yet.)
  build:
    needs: [test, unit]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The site is every file in the repository, except the ones for development
      - name: Collect the files of the site
        run: |
          mkdir _site
          git ls-files | grep -vE '^(test|tools|\.github)/|^package(-lock)?\.json$|^\.gitignore$|^eslint\.config\.js$' \
            | xargs cp --parents -t _site
      # Each attempt of a run gets an artifact of its own: when a run is run
      # again, the artifact of the earlier attempt is still there, and with
      # the same name deploy-pages stops ("Multiple artifacts named ...").
      # The name goes to the deploy job as an output, so that it is also
      # right when only the deploy job is run again.
      - id: name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
          name: ${{ steps.name.outputs.artifact }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}

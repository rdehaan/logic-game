# Runs the tests on every push and pull request. On a push to main, the site
# is published to GitHub Pages afterwards, but only if the tests pass.
#
# For this, GitHub Pages must be set to deploy from GitHub Actions:
# repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

# Only read access by default; the deploy job asks for what it needs
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # The site is put together in a job of its own. The deploy job comes after
  # it, and by then the uploaded artifact is always in the list that
  # deploy-pages asks for. (Uploading and deploying in the same job sometimes
  # failed with "Found 0 artifact(s)", because right after the upload the
  # artifact is not always in that list yet.)
  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      # The site is every file in the repository, except the ones for development
      - name: Collect the files of the site
        run: |
          mkdir _site
          git ls-files | grep -vE '^(test|tools|\.github)/|^package(-lock)?\.json$|^\.gitignore$' \
            | xargs cp --parents -t _site
      # Each attempt of a run gets an artifact of its own: when a run is run
      # again, the artifact of the earlier attempt is still there, and with
      # the same name deploy-pages stops ("Multiple artifacts named ...").
      # The name goes to the deploy job as an output, so that it is also
      # right when only the deploy job is run again.
      - id: name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ steps.name.outputs.artifact }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}

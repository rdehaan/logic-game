# Runs the tests on every push and pull request. On a push to main, the site
# is published to GitHub Pages afterwards, but only if the tests pass.
#
# For this, GitHub Pages must be set to deploy from GitHub Actions:
# repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # The site is every file in the repository, except the ones for development
      - name: Collect the files of the site
        run: |
          mkdir _site
          git ls-files | grep -vE '^(test|tools|\.github)/|^package(-lock)?\.json$|^\.gitignore$' \
            | xargs cp --parents -t _site
      # Each attempt of a run gets an artifact of its own: when a run is run
      # again, the artifact of the earlier attempt is still there, and with
      # the same name deploy-pages stops ("Multiple artifacts named ...").
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # Right after the upload, the artifact is sometimes not yet in the list
      # that deploy-pages asks for, and then it stops ("Found 0 artifact(s)").
      # So wait (at most about a minute) until the artifact can be seen.
      - name: Wait until the artifact can be seen
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: github-pages-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$NAME" --jq '.total_count')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 2
          done
          echo "The artifact $NAME cannot be seen after a minute; deploy-pages will try anyway."
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
